# Azure DevOps pipeline: one-time (idempotent, re-runnable) setup per
# subscription onboarding to the migration - deploys monitoring (Action Group
# + Activity Log Alerts) and the Policy Initiative assignment. Run this
# BEFORE the first batch pipeline (keyvault-migration-batch.yml) targets a
# new subscription.

trigger: none
pr: none

parameters:
  - name: subscriptionId
    type: string
  - name: managementGroupId
    type: string
    # No default: policies/terraform/ is Management-Group-scope only (no subscription
    # fallback), so this must always be supplied.
  - name: logAnalyticsWorkspaceId
    type: string
  - name: actionGroupEmail
    type: string
  - name: enforcementMode
    type: string
    default: "DoNotEnforce"
    values:
      - DoNotEnforce
      - Default
  - name: denyPolicyEffect
    type: string
    default: "Audit"
    values:
      - Audit
      - Deny
      - Disabled

stages:
  - stage: OnboardSubscription
    jobs:
      - deployment: Onboard
        environment: "keyvault-migration-onboarding" # approval gate: platform team lead sign-off
        pool:
          vmImage: "windows-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzurePowerShell@5
                  displayName: "Deploy monitoring (Action Group + Activity Log Alerts)"
                  inputs:
                    azureSubscription: "svc-conn-${{ parameters.subscriptionId }}"
                    azurePowerShellVersion: LatestVersion
                    scriptType: filePath
                    scriptPath: scripts/migration/Deploy-Monitoring.ps1
                    scriptArguments: >-
                      -SubscriptionId ${{ parameters.subscriptionId }}
                      -ActionGroupEmail "${{ parameters.actionGroupEmail }}"

                # Requires a remote Terraform state backend to be configured in
                # policies/terraform/versions.tf (none is checked in yet - local
                # state doesn't survive between pipeline runs). Add an `azurerm`
                # backend block pointing at this org's existing Terraform state
                # storage account before wiring this step up for real.
                - task: AzureCLI@2
                  displayName: "Deploy Policy Initiative and assignment (Terraform)"
                  inputs:
                    azureSubscription: "svc-conn-${{ parameters.subscriptionId }}"
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: "$(Build.SourcesDirectory)/policies/terraform"
                    inlineScript: |
                      set -euo pipefail
                      terraform init -input=false
                      terraform apply -input=false -auto-approve \
                        -var "management_group_id=${{ parameters.managementGroupId }}" \
                        -var "log_analytics_workspace_id=${{ parameters.logAnalyticsWorkspaceId }}" \
                        -var "deny_policy_effect=${{ parameters.denyPolicyEffect }}" \
                        -var "enforce=$([ '${{ parameters.enforcementMode }}' = 'Default' ] && echo true || echo false)"
